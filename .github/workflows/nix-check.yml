name: nix-check

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'nix/**'
      - 'scripts/**'
      - '.chezmoi.toml.tmpl'
      - '.sops.yaml'
      - '.github/workflows/nix-check.yml'
  push:
    branches: [main]
    paths:
      # - 'nix/**'
      - 'scripts/**'
      - '.chezmoi.toml.tmpl'
      - '.sops.yaml'
      - '.github/workflows/nix-check.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    name: Nix Flake Check
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        !startsWith(github.event.head_commit.message, 'Merge pull request ')
      )
    runs-on: macos-26
    permissions:
      contents: read # actions/checkout

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: DeterminateSystems/determinate-nix-action@4d65ea9cab522b6d9f29a170aed23ededc1b27af # v3.23.0
        with:
          kvm: false

      - name: Use Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: 5h0uta
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - run: nix --version

      - name: flake check
        shell: bash
        run: |
          set -euo pipefail
          cd nix
          nix flake check

      - name: eval each darwin host
        shell: bash
        run: |
          set -euo pipefail
          cd nix
          for h in hosts/darwin/*; do
            [[ -d "$h" ]] || continue
            hn="$(basename "$h")"
            echo "==> evaluating $hn"
            nix eval ".#darwinConfigurations.${hn}.config.system.build.toplevel" >/dev/null
          done

      - name: Test bootstrap with disposable identities
        shell: bash
        run: |
          set -euo pipefail
          /bin/bash -n scripts/setup.sh scripts/tests/setup-test.sh
          bootstrap_tools="$(nix build --no-update-lock-file --no-link --print-out-paths ./nix#bootstrap-tools)"
          /bin/bash scripts/tests/setup-test.sh "$bootstrap_tools"
